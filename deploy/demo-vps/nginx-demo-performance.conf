# Глобальные улучшения для демо (подключается из /etc/nginx/nginx.conf → conf.d)

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml
    font/woff
    font/woff2;

open_file_cache max=4000 inactive=30s;
open_file_cache_valid 45s;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# Old NikaCRM-Offline-Setup-X.Y.Z-x64.exe names 302 to the file
# currently in /var/www/nikacrm-downloads/. The target is rewritten by
# sync-windows-setup-redirect.sh on every SETUP release.
location ~ ^/downloads/(NikaCRM-Offline-Setup-[0-9]+\.[0-9]+\.[0-9]+-x64\.exe)$ {
    alias /var/www/nikacrm-downloads/$1;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600" always;
    error_page 404 = @nikacrm_setup_latest;
}

include /etc/nginx/snippets/nikacrm-setup-latest.conf;

location /downloads/ {
    alias /var/www/nikacrm-downloads/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
}

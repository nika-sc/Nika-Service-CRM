<div class="modal fade" id="diagnosticsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-stethoscope me-2"></i>Диагностика</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning py-2 px-3 d-none" id="diagnosticsPendingHint" role="status"></div>
                <label class="form-label">Результат диагностики (видит клиент в ЛК)</label>
                <select class="form-select mb-2" id="diagnosticsTemplateSelect">
                    <option value="">Шаблон диагностики — выберите, чтобы подставить текст</option>
                </select>
                <textarea class="form-control" id="diagnosticsText" rows="6" maxlength="8000"></textarea>
                <div class="form-text" id="diagnosticsTextHint">После сохранения текст может изменить только администратор. Без текста нельзя закрыть заявку.</div>
                <div class="mt-3" id="diagnosticsFileWrap">
                    <label class="form-label">Фото / PDF (JPEG, PNG, PDF, до 5 МБ, не больше 10). Можно выбрать несколько сразу.</label>
                    <input type="file" class="form-control" id="diagnosticsFileInput" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">
                </div>
                <div id="diagnosticsFilesList" class="mt-2 small"></div>
                <div class="mt-3">
                    <div class="fw-semibold mb-2"><i class="fas fa-history me-1"></i>История</div>
                    <div id="diagnosticsHistoryList" class="small text-muted">Записей нет</div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                <button type="button" class="btn btn-primary" id="saveDiagnosticsBtn">Сохранить текст</button>
            </div>
        </div>
    </div>
</div>

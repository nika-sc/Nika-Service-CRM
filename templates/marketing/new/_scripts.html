<script src="{{ url_for('static', filename='cdn/bootstrap/5.3.0/js/bootstrap.bundle.min.js') }}"></script>
<script>
(function () {
    var shots = {{ screenshot_files | tojson }};
    var shotModalEl = document.getElementById('shotCarouselModal');
    var shotTitleEl = document.getElementById('shotCarouselTitle');
    var shotImageEl = document.getElementById('shotCarouselImage');
    var prevBtn = document.getElementById('shotPrevBtn');
    var nextBtn = document.getElementById('shotNextBtn');
    var currentIndex = 0;
    var staticBase = "{{ url_for('static', filename='') }}";

    function renderShot(index) {
        if (!shots.length) return;
        var len = shots.length;
        currentIndex = ((index % len) + len) % len;
        var shot = shots[currentIndex];
        shotTitleEl.textContent = shot.title + " (" + (currentIndex + 1) + " / " + len + ")";
        shotImageEl.src = staticBase + shot.file;
        shotImageEl.alt = shot.title;
    }

    if (shotModalEl && window.bootstrap) {
        shotModalEl.addEventListener('show.bs.modal', function (event) {
            var trigger = event.relatedTarget;
            var idx = 0;
            if (trigger && trigger.dataset && trigger.dataset.shotIndex) {
                idx = parseInt(trigger.dataset.shotIndex, 10) || 0;
            }
            renderShot(idx);
        });
        if (prevBtn) prevBtn.addEventListener('click', function () { renderShot(currentIndex - 1); });
        if (nextBtn) nextBtn.addEventListener('click', function () { renderShot(currentIndex + 1); });
        shotModalEl.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowLeft') { event.preventDefault(); renderShot(currentIndex - 1); }
            else if (event.key === 'ArrowRight') { event.preventDefault(); renderShot(currentIndex + 1); }
        });
    }

    var shouldOpen = {{ 'true' if open_login else 'false' }};
    if (shouldOpen) {
        var el = document.getElementById('demoLoginModal');
        if (el && window.bootstrap) {
            bootstrap.Modal.getOrCreateInstance(el).show();
            var user = document.getElementById('username');
            if (user) user.focus();
        }
    }
})();
</script>
{% if demo_visitor_stats_enabled %}
<script>
    window.demoVisitorStatsEnabled = true;
    window.demoVisitorHeartbeat = false;
    window.demoVisitorPollOnline = true;
</script>
<script src="{{ url_for('static', filename='js/demo_presence.js') }}"></script>
{% endif %}

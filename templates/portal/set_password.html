<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Задать пароль — личный кабинет</title>
    <link href="{{ url_for('static', filename='cdn/bootstrap/5.3.0/css/bootstrap.min.css') }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='cdn/font-awesome/7.0.0/css/all.min.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fas fa-key fa-3x text-primary mb-3"></i>
            <h2>Пароль кабинета</h2>
            {% if name %}
            <p class="text-muted">{{ name }}</p>
            {% endif %}
        </div>

        {% if success %}
        <div class="alert alert-success">
            Пароль сохранён. Теперь можно войти в кабинет.
        </div>
        <a class="btn btn-primary w-100" href="{{ url_for('customer_portal.portal_login', phone=phone) if phone else url_for('customer_portal.portal_login') }}">Перейти ко входу</a>
        {% else %}
            {% if error %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
            </div>
            {% endif %}
            {% if token %}
            <form method="POST" action="{{ url_for('customer_portal.portal_set_password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                <input type="hidden" name="token" value="{{ token }}">
                <div class="mb-3">
                    <label for="password" class="form-label">Новый пароль</label>
                    <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="mb-3">
                    <label for="password_confirm" class="form-label">Повторите пароль</label>
                    <input type="password" class="form-control" id="password_confirm" name="password_confirm" required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Сохранить пароль</button>
            </form>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
